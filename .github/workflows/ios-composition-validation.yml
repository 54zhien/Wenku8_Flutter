name: iOS composition validation (no package)

on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-composition-validation']

permissions:
  contents: read

jobs:
  native-capture:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: python3 tools/check_public_source.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Check native-control composition contracts
        run: flutter test --no-pub --dart-define=WENKU8_NATIVE_GLASS=true test/ios_composition_boundary_test.dart test/ios_scroll_edge_test.dart test/ios_route_motion_test.dart
      - name: Compile simulator application without packaging
        run: flutter build ios --simulator --debug --no-codesign --dart-define=WENKU8_NATIVE_GLASS=true
      - name: Select additional iOS 26.2 hosted unit-test target
        run: |
          set -euo pipefail
          mkdir -p build/composition
          xcrun simctl list devices available --json > build/composition/devices.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path('build/composition/devices.json').read_text())['devices']
          phones = [device for runtime, group in devices.items()
                    if runtime == 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
                    for device in group if device.get('isAvailable') and device['name'] == 'iPhone 17 Pro']
          assert len(phones) == 1, 'Required additional iOS 26.2 hosted target is unavailable'
          Path('build/composition/target.json').write_text(json.dumps(phones[0], indent=2))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('COMPOSITION_TEST_UDID=' + phones[0]['udid'] + '\n')
          PY
      - name: Execute hosted native capture and protocol tests
        run: |
          set -euo pipefail
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "id=$COMPOSITION_TEST_UDID" -parallel-testing-enabled NO -only-testing:RunnerTests -resultBundlePath build/composition/native-capture.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/composition/native-capture.log
      - name: Boot the actual integration target after XCTest clone teardown
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 tools/wait_ios_test_target.py "$COMPOSITION_TEST_UDID" build/composition
          flutter devices --machine > build/composition/flutter-devices.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path('build/composition/flutter-devices.json').read_text())
          assert any(d['id'] == os.environ['COMPOSITION_TEST_UDID'] and d['targetPlatform'] == 'ios' for d in devices), 'Selected iOS simulator is not discoverable by Flutter'
          PY
      - name: Verify native textures include changing Flutter-rendered content
        timeout-minutes: 8
        run: |
          set -euo pipefail
          flutter test --no-pub integration_test/ios_native_capture_test.dart -d "$COMPOSITION_TEST_UDID" --dart-define=WENKU8_NATIVE_GLASS=true --reporter expanded 2>&1 | tee build/composition/flutter-native-capture.log
      - name: Measure the delivered and candidate composition paths on the same simulator
        timeout-minutes: 20
        run: |
          set -euo pipefail
          candidate_root="$GITHUB_WORKSPACE"
          baseline_root="$RUNNER_TEMP/wenku-delivered-composition"
          git fetch --depth=1 origin 7bfd1edab5fbb7720173c88b06d30bf064ac54e7
          git worktree add --detach "$baseline_root" FETCH_HEAD
          cmp integration_test/ios_motion_benchmark_test.dart "$baseline_root/integration_test/ios_motion_benchmark_test.dart"
          for variant in before edge_only after; do
            if [ "$variant" = before ]; then cd "$baseline_root"; else cd "$candidate_root"; fi
            flutter pub get
            route_texture=true
            if [ "$variant" = edge_only ]; then route_texture=false; fi
            flutter test --no-pub integration_test/ios_motion_benchmark_test.dart -d "$COMPOSITION_TEST_UDID" --dart-define=WENKU8_NATIVE_GLASS=true --dart-define="WENKU8_ROUTE_TEXTURE=$route_texture" --dart-define="BENCHMARK_LABEL=$variant" --reporter expanded 2>&1 | tee "$candidate_root/build/composition/$variant.log"
          done
          cd "$candidate_root"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/composition')
          reports = {}
          for variant in ('before', 'edge_only', 'after'):
              records = [line.split('WENKU_MOTION_JSON=', 1)[1] for line in (root / f'{variant}.log').read_text().splitlines() if 'WENKU_MOTION_JSON=' in line]
              assert len(records) == 1, f'Missing or duplicate motion report: {variant}'
              reports[variant] = json.loads(records[0])
              assert reports[variant]['mode'] == 'debug'
              assert len(reports[variant]['scenes']) == 2
          assert reports['before']['physical_size'] == reports['after']['physical_size']
          assert reports['before']['physical_size'] == reports['edge_only']['physical_size']
          comparison = {'scope': 'same iOS 26.2 simulator debug scenes; not release FPS or physical-device acceptance', 'before_sha': '7bfd1edab5fbb7720173c88b06d30bf064ac54e7', 'scenes': {}}
          for name, original in reports['before']['scenes'].items():
              revised = reports['after']['scenes'][name]
              assert original['refresh_hz'] == revised['refresh_hz']
              assert revised['native_counts_available'] is True
              assert isinstance(revised['native_work_counts'], dict)
              edge_only = reports['edge_only']['scenes'][name]
              assert original['refresh_hz'] == edge_only['refresh_hz']
              comparison['scenes'][name] = {variant: {key: value for key, value in data.items() if key != 'frames'} for variant, data in [('before', original), ('edge_only', edge_only), ('after', revised)]}
          (root / 'comparison.json').write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          PY
      - name: Preserve validation evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-composition-validation-${{ github.sha }}
          path: build/composition
          if-no-files-found: ignore
